<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text to Speech Converter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 50px auto;
            background: #fff;
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical;
        }
        input[type="file"] {
            display: block;
            margin-top: 10px;
        }
        .divider {
            text-align: center;
            margin: 20px 0;
            font-weight: bold;
            color: #888;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        #loading {
            display: none;
            text-align: center;
            margin-top: 15px;
            font-style: italic;
            color: #555;
        }
        #error-msg {
            display: none;
            color: #e74c3c;
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Text to Speech Converter</h1>
        <form id="tts-form">
            <div class="form-group">
                <label for="text">Option 1: Enter Text Manually</label>
                <textarea id="text" name="text" placeholder="Type or paste your text here..."></textarea>
            </div>
            
            <div class="divider">OR</div>
            
            <div class="form-group">
                <label for="file">Option 2: Upload Text Document (.txt)</label>
                <input type="file" id="file" name="file" accept=".txt">
            </div>

            <div class="form-group">
                <label for="voice">Voice Type</label>
                <select id="voice" name="voice" style="width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #ccc;">
                    <option value="en-US-JennyNeural|chat">Smooth Girl (Natural Chat)</option>
                    <option value="en-US-AriaNeural|newscast">Female Announcer (Professional)</option>
                    <option value="en-US-AriaNeural|cheerful">Female (Friendly & Cheerful)</option>
                    <option value="en-US-JaneNeural|none">Female (Natural Storytelling)</option>
                    <option value="en-US-GuyNeural|newscast">Male Announcer (Professional)</option>
                    <option value="en-US-JasonNeural|none">Male (Casual & Natural)</option>
                    <option value="en-US-DavisNeural|chat">Deep Male (Conversational/Background)</option>
                    <option value="en-US-AnaNeural|none">Little Girl</option>
                    <option value="en-US-KevinNeural|none">Little Boy</option>
                </select>
            </div>

            <div class="form-group">
                <label for="speed">Speech Speed</label>
                <select id="speed" name="speed" style="width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #ccc;">
                    <option value="slow">Slow</option>
                    <option value="medium" selected>Medium</option>
                    <option value="fast">Fast</option>
                    <option value="very_fast">Very Fast</option>
                </select>
            </div>

            <button type="submit">Convert to Speech</button>
        </form>
        <div id="loading">Converting... Please wait.</div>
        <div id="error-msg"></div>
    </div>

    <script>
        document.getElementById('tts-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const form = e.target;
            const formData = new FormData(form);
            const loading = document.getElementById('loading');
            const errorMsg = document.getElementById('error-msg');
            const submitBtn = form.querySelector('button');
            
            // Check if at least one input is provided
            const text = formData.get('text');
            const file = formData.get('file');
            
            if (!text.trim() && (!file || file.size === 0)) {
                errorMsg.textContent = "Please enter text or upload a document.";
                errorMsg.style.display = 'block';
                return;
            }

            loading.style.display = 'block';
            errorMsg.style.display = 'none';
            submitBtn.disabled = true;

            try {
                const response = await fetch('/convert', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = url;
                    a.download = 'speech-output.mp3';
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                } else {
                    const errData = await response.json();
                    errorMsg.textContent = errData.detail || "An error occurred during conversion.";
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                errorMsg.textContent = "Network error. Please try again.";
                errorMsg.style.display = 'block';
            } finally {
                loading.style.display = 'none';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
